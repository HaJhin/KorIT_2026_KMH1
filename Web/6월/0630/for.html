        function sayHi() {
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += '<li> 안녕 </li>';
            }
            return result;
        }
        document.write(`<ul> ${sayHi()} </ul>`);


        function plusNum() {
            let inputNum = Number(document.getElementById('inputNum').value);
            let totalNum = 0;
            for (let i = 1; i <= inputNum; i++) {
                totalNum += i;
            }
            document.getElementById('plusNumResult').innerText = totalNum;
        }
    </script>

<body>
    <hr>
    <h3>1부터 입력한 수까지의 합</h3>
    <input type="number" id="inputNum" placeholder="정수 입력">
    <button onclick="plusNum()">계산</button>
    <h2 id="plusNumResult"></h2>
</body>
