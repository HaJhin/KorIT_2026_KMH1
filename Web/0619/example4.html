<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="example4.css">
</head>

<body>
    <div class="register-container">
        <h1> 회원가입 </h1>
        <div class="form-row">
            <label for="id"> 아이디 </label>
            <input type="text" id="id" placeholder="아이디를 입력하세요">
            <button> 중복확인 </button>
        </div>
        <div class="form-row"> <label for="password"> 비밀번호 </label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요">
        </div>
        <div class="form-row"> <label for="email"> 이메일 </label>
            <input type="text" id="email" placeholder="이메일 아이디"> @
            <select>
                <option> daum.net </option>
                <option> naver.com </option>
                <option> gmail.com </option>
                <option selected> 직접 입력 </option>
            </select> 
        </div>
        <div class="form-row"> <label for="address"> 주소 </label>
            <input type="text" id="address" placeholder="주소를 입력하세요">
        </div> 
        <div class="form-row"> <label for="gender"> 성별 </label>
            <input type="radio"> 남성 <input type="radio"> 여성
        </div>
        <div class="form-row"> 
            <button class="btn-group"> 회원가입 </button>
            <button class="btn-group"> 취소 </button>
        </div>
    </div>
</body>

</html>
