<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="example.css">
</head>

<body>
    <header>
        <h1> Flexbox Layout 연습 </h1>
    </header>
    <nav>
        <ul>
            <li> 홈 </li>
            <li> 공지사항 </li>
            <li> 문의 </li>
        </ul>
    </nav>

    <main>
        <section>
            <h2> 메인 컨텐츠 </h2>
            <p> 이 구역은 본문 내용을 표시하는 구역이다. </p> 
            <p> Flexbox를 이용해 왼쪽에 배치된다. </p>    

        </section>
        <aside>
            <h2> 사이드 바 </h2>
            <p> 보조 정보나 공지사항을 표시하는 구역이다. </p>
        </aside>
    </main>
    
    <footer>
        <p> &copy; 2025 Flex Layout Practice </p>
    </footer>
</body>

</html>
