<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="example4.css">
</head>

<body>
    <div class="register-container">
        <h2> 회원가입 </h2>
        <div class="form-row">
            <label class="row-label"> 아이디 </label>
            <input type="text" placeholder="아이디를 입력하세요">
            <button type="button"> 중복확인 </button>
        </div>
        <div class="form-row"> <label class="row-label"> 비밀번호 </label>
            <input type="password" placeholder="비밀번호를 입력하세요">
        </div>
        <div class="form-row"> <label class="row-label"> 이메일 </label>
            <input type="text" placeholder="이메일 아이디"> @
            <select>
                <option> daum.net </option>
                <option> naver.com </option>
                <option> gmail.com </option>
                <option selected> 직접 입력 </option>
            </select> 
        </div>
        <div class="form-row"> <label class="row-label"> 주소 </label>
            <input type="text"" placeholder="주소를 입력하세요">
        </div> 
        <div class="form-row"> <label class="row-label"> 성별 </label>
            <div class="radio-group">
                <input type="radio" name="gender" id="male"> <label for="male">남성</label> 
                <input type="radio" name="gender" id="female"> <label for="female">여성</label>
            </div>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn-submit"> 회원가입 </button>
            <button class="btn-cancel"> 취소 </button>
        </div>
    </div>
</body>

</html>
