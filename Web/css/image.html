<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* p 태그에 두께 1px, 스타일 solid, 색 black 주기 */
        p {
            border: 1px solid black;
            width: 800px;
            height: 800px;
        }

        /* 배경 스타일 주기 */
        .b1 {background-color: #3498db;}

        /* 배경 이미지 background-image : url */
        .b2 {
            background-image: url(royalblood.jpg);
            background-repeat: repeat;
        }

        /* 배경 이미지 위치 : background-position : center, right, left, top, bottom */
        .b3 {
            background-image: url(royalblood.jpg);
            background-repeat: no-repeat;
            background-position: center;
        }

        .b4 {background: skyblue url(royalblood.jpg) no-repeat center;}

        /* 그라데이션 주기 */
        .d1 {
            width: 400px; height: 400px;
            background: linear-gradient(to left,skyblue,pink);
        }
    </style>
</head>
<body>
    <p class="b1"> 안녕하세요 반갑습니다 css 공부중입니다. </p>
    <p class="b2"> 안녕하세요 반갑습니다 css 공부중입니다. </p>
    <p class="b3"> 안녕하세요 반갑습니다 css 공부중입니다. </p>
    <p class="b4"> 안녕하세요 반갑습니다 css 공부중입니다. </p>
    <p class="b5"> 안녕하세요 반갑습니다 css 공부중입니다. </p>
    
    <div class="d1">  </div>
</body>
</html>
