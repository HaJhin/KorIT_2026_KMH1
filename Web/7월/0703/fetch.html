<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 랜덤 강아지 사진 가져오기 -->
    <button id="dogBtn">랜덤 강아지</button>
    <img src="" id="show" alt="강아지 사진" style="width: 300px;">
    <hr>
    <h2>음악 검색기</h2>
    <!-- 검색어를 입력하고 검색버튼을 누르면 리스트로 5개를 출력한다. -->
    <input id="search" placeholder="검색어 입력">
    <button id="btn">검색</button>
    <ul id="music"></ul>
    <hr>
    <h2>http 코드 상태 확인</h2>
    <button id="btn3">상태 확인</button>
    <p id="result4"></p>
    <hr>
    <h2>POST 요청하기</h2>
    <input id="name" placeholder="이름 입력"><br>
    <input id="email" placeholder="이메일 입력"><br>
    <button id="btn4">추가하기</button>

    <script>
        let search = document.getElementById("search");
        let btn = document.getElementById("btn");
        let music = document.getElementById("music");

        btn.addEventListener("click", () => {
            const keyword = search.value;
            if (!keyword) {
                alert("검색어를 입력하세요");
                return;
            }
            fetch(`https://itunes.apple.com/search?term=${keyword}&entity=song&limit=5`)
                .then(res => res.json())
                .then(data => {
                    const html = data.results.length ?
                        data.results.map(item => `<li>${item.trackName} - ${item.artistName}</li>`).join("") : "<li>검색 결과 없음</li>";

                    music.innerHTML = html;
                })
        })

        let dogBtn = document.getElementById("dogBtn");
        let show = document.getElementById("show");

        dogBtn.addEventListener("click", () => {
            fetch("https://picsum.photos/v2/list?page=2&limit=100")
                .then(response => response.json())
                .then(data => {
                    // 0 ~ data.lengh-1 사이의 랜덤번호 생성
                    let num = Math.floor(Math.random() * data.length);
                    show.src = data[num].download_url;
                    console.log("success");
                })
        })

        document.getElementById("btn3").addEventListener("click", () => {
            try {
                fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(res => {
                    document.getElementById("result4").innerText = res.ok;
                    if (!res.ok) {
                        throw new Error("회원 정보를 불러오지 못했습니다.")
                    }
                    return res.json();
                })
                .then(data => {
                    console.log(data);
                    document.getElementById("result4").innerText = data.title;
                })
            } catch (error) {}
        });

        // 서버에 데이터를 보낼 때는 method, headers, body를 사용한다.
        document.getElementById("btn4").addEventListener("click", async () => {
            const inputData = {
                name : document.getElementById("name").value,
                email : document.getElementById("email").value
            }
            
            await fetch("https://jsonplaceholder.typicode.com/users",{
                method : "POST",
                headers : {"Content-type" : "application/json"},
                body : JSON.stringify(inputData)
            })
            .then(res => res.json())
            .then(data => console.log("등록 결과 : ",data))
        })
    </script>
</body>

</html>
