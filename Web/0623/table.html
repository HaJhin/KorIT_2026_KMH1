<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- [CSS 조건]

    헤더 구조 스타일: 테이블의 첫 번째 자식 행(tr:first-child)은 배경색 #2c3e50, 글자색 #ffffff로 고정하세요.

    구조 의사 클래스 활용: 첫 번째 행(헤더)을 제외하고, 데이터가 작성되는 tr 중 짝수(even) 번째 행에만 배경색 #f8f9fa를 적용하여 가독성을 높이세요.

    동적 의사 클래스 및 부정 선택자 조합: 사용자가 데이터 행에 마우스를 올렸을 때(:hover) 
    배경색이 #ebf5fb로 바뀌며 마우스 커서가 포인터(cursor: pointer)로 변하게 하세요. 
    단, 첫 번째 행(헤더)과 마지막 행(총합)은 마우스를 올려도 이 hover 스타일이 절대 적용되지 않도록 
    :not() 선택자를 결합하여 방어 코드를 짜야 합니다.

    마지막 행 스타일: 테이블의 가장 마지막 자식 행(tr:last-child)은 배경색 #eaeded, 글자색 #2c3e50, 글자 두께 bold로 지정하세요. -->
    <style>
        .data{
            width: 100%;
            border-collapse: collapse;
        }

        .data th,
        .data td{
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .data tr:first-child {
            background-color: #2c3e50;
            color: #ffffff;
        }

        .data tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .data tr:last-child {
            background-color: #eaeded;
            color: #2c3e50;
            font-weight: bold;
        }

        .data tr:not(:last-child, :first-child):hover {
            background-color: #ebf5fb;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1> 사원 성과 테이블 </h1>
        <table class="data">
            <tr>
                <th> 사원번호 </th>
                <th> 이름 </th>
                <th> 직급 </th>
                <th> 성과점수 </th>
            </tr>
            <tr>
                <td> A001 </td>
                <td> 김철수 </td>
                <td> 팀장 </td>
                <td> 95점 </td>
            </tr>
            <tr>
                <td> A002 </td>
                <td> 이영희 </td>
                <td> 대리 </td>
                <td> 88점 </td>
            </tr>
            <tr>
                <td> A003 </td>
                <td> 박민수 </td>
                <td> 사원 </td>
                <td> 72점 </td>
            </tr>
            <tr>
                <td> A004 </td>
                <td> 최지우 </td>
                <td> 사원 </td>
                <td> 84점 </td>
            </tr>
            <tr>
                <td> 총계 </td>
                <td> 4명 </td>
                <td> - </td>
                <td> 평균 84.75점 </td>
            </tr>
        </table>
</body>

</html>

<!-- [HTML 조건]

하나의 table 태그를 생성하고, 내부에는 행을 나타내는 tr 태그들을 배치하세요.

첫 번째 tr은 테이블 헤더 영역으로 제목 항목들(th)을 포함해야 합니다.

그 뒤로 최소 4개 이상의 데이터 행(tr 안에 td)을 구성하고, 마지막 행은 총합을 나타내는 행으로 만드세요. -->
