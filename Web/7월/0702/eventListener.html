<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: gray;
            transition: all 0.8s ease;
        }
    </style>
</head>
<body>
    <!-- html과 js가 완전히 분리된다. -->
    <button id="btn">클릭하세요</button>

    <div id="box"> 커서를 올려보세요 </div>
    <hr>
    <input id="text">
    <p id="result"> </p>
    <hr>
    <input id="input">
    <script>
        // 이벤트리스너 방식으로 이벤트 처리하기
        // addEventListener("이벤트",실행할 함수) : 이벤트 등록 메서드

        const btn = document.getElementById("btn");

        btn.addEventListener("click", () => alert("안녕하세요."));

        const box = document.getElementById("box");
        
        box.addEventListener("mouseover", () => {
            let background = box.style.backgroundColor
            if(background === "gray") {
                background = "royalblue"
            } else {
                background = "gray"
            }
        });

        const currentText = document.getElementById("text");
        const result = document.getElementById("result");

        currentText.addEventListener("input", () => {
            result.innerText = currentText.value;
        })

        // change : 선택을 완료했을때 발생하는 이벤트

        // focus/blur 
        // input 태그에 포커스가 잡히면 테두리를 노란색으로 빠져나오면 테두리를 파란색으로 만들기
        const inputBox = document.getElementById("input");

        inputBox.addEventListener("focus", () => {
            inputBox.style.border = "5px solid yellow"
        })
        inputBox.addEventListener("blur", () => {
            inputBox.style.border = "1px solid blue"
        })

    </script>
</body>
</html>
