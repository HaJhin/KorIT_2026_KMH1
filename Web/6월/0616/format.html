<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 텍스트 서식을 표현할 수 있는 태그 -->

    <!-- b 태그 or string 태그
     굵은 텍스트(bold) -->
    <p> <b>단락</b>을 구별하는 <strong>태그</strong>는 p태그이다. </p>

    <!-- i 태그 or em 태그
     기울인 텍스트(italic) -->
     <p> <i>단락</i>을 구별하는 <em>태그</em>는 p태그이다. </p>

    <!-- del 태그
     취소선 텍스트 -->
     <p> <del>단락</del>을 구별하는 <del>태그</del>는 p태그이다. </p>

    <!-- small 태그
     작은 텍스트 -->
    <p> <small>단락</small>을 구별하는 <small>태그</small>는 p태그이다. </p>

    <!-- mark 태그
     하이라이트 처리된 텍스트 -->
    <p> <mark>단락</mark>을 구별하는 <mark>태그</mark>는 p태그이다. </p>

    <!-- sub 태그 
     아래로 나오는 텍스트 -->
     <p> <sub>단락</sub>을 구별하는 <sub>태그</sub>는 p태그이다. </p>

    <!-- sup 태그 
     위로 나오는 텍스트 -->
     <p> <sup>단락</sup>을 구별하는 <sup>태그</sup>는 p태그이다. </p>
</body>
</html>
