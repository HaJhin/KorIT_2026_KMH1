<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>SNS 서비스별 이용률(%)</caption>
        <tr> 
            <td>  </td>
            <th> 페이스북 </th>
            <th> 카카오스토리 </th>
            <th> 밴드 </th>
            <th> 인스타그램 </th>
            <th> 트위터 </th>
        </tr>
        <tr>
            <th> 2015년 </th>
            <td> 77.1 </td>
            <td> 58.3 </td>
            <td> 32.4 </td>
            <td> 16.7 </td>
            <td> 22.1 </td>
        </tr>
        <tr>
            <th> 2016년 </th>
            <td> 73.8 </td>
            <td> 51.0 </td>
            <td> 40.1 </td>
            <td> 28.1 </td>
            <td> 14.7 </td>
        </tr>
    </table>
    <hr>
    <table border="1">
        <!-- 표의 제목 부분
         보통 컬럼명을 th를 이용해 작성한다. -->
        <thead>
            <tr>
                <th>이름</th>
                <th>과목</th>
                <th>점수</th>
            </tr>
        </thead>
        <!-- 실제 데이터가 들어가는 영역 -->
        <tbody>
                <tr>
                    <td> 김철수철수 </td>
                    <td> HTML </td>
                    <td> 90 </td>
                </tr>
                <tr>
                    <td> 남궁독고민수 </td>
                    <td> CSS </td>
                    <td> 80 </td>
                </tr>
                <tr>
                    <td> 황금독수리온세상을놀라게하다 </td>
                    <td> Java </td>
                    <td> 100 </td>
                </tr>
        </tbody>
        <!-- 합계 결과, 요약 영역 -->
        <tfoot>
                <td colspan="2"> 평균 점수 </td>
                <td> 80 </td>
        </tfoot>
    </table>
</body>
</html>
