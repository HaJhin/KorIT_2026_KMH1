<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 버튼을 클릭하면 배열에서 메뉴 하나를 랜덤으로 선택하여 결과 영역에 출력
        function recommend() {
            let menus = ["김치찌개","돈까스","비빔밥","햄버거","초밥","짜장면"];
            let result = menus[Math.floor(Math.random() * menus.length)];
            document.getElementById("result").innerHTML = result;
        }

        let fruitList = [];

        function refList() {
            let list = "";
            for (let i = 0; i < fruitList.length; i++) {
                list += `<li>${fruitList[i]}</li>`;
            }
            document.getElementById("fruitList").innerHTML = list;
        }

        function addFruit() {
            let fruitInput = document.getElementById("fruit");
            let fruit = fruitInput.value;
            if (fruitList.includes(fruit)) {
                alert("이미 등록된 과일입니다.");
                return;
            } else {
                fruitList = [...fruitList,fruit];
                fruitInput.value = '';
            }
            refList();
        }

        function deleteFruit() {
            fruitList.splice(fruitList.length-1,1);
            refList();
        }
    </script>
</head>
<body>
    <h1>점심 메뉴 추천기</h1>
    <!-- 메뉴 추천 버튼 -->
     <button onclick="recommend()">점메추 ㄱㄱ</button>
     <!-- 결과를 출력 -->
     <h3 id="result"></h3>
    <hr>
    <h1>과일 목록 관리</h1>
    <!-- 과일 이름 입력 -->
    <!-- 추가 버튼, 삭제 버튼 -->
    <!-- 과일 목록을 추가할 ul -->
    <!-- 추가 버튼을 누르면 입력한 과일을 배열의 맨 뒤에 추가. input 비우기 -->
    <!-- 입력한 과일이 이미 배열에 존재한다면 "이미 등록된 과일" 경고창 띄우기 -->
    <!-- 삭제 버튼을 누르면 배열의 마지막 요소를 삭제하고 ul에 반영 -->
    <input type="text" id="fruit" placeholder="과일 이름 입력">
    <button onclick="addFruit()">과일 추가</button>
    <button onclick="deleteFruit()">과일 삭제</button>
    <ul id="fruitList"></ul>
</body>
</html>
