<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-card{
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px;
            width: 200px;
            background-color: #fff;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* block에 종속된 하위 요소 */
        .product-card__image{
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }

        .product-card__title{
            font-size: 18px;
            font-weight: bold;
        }

        .product-card__price{
            color: #e74c3c;
        }

        /* Modifier */
        .product-card--soldout{
            background-color: #f5f5f5;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="product-card"> 
        <div class="product-card__image"> IMAGE </div>
        <h3 class="product-card__title"> 기본 후드티 </h3>
        <p class="product-card__price"> 39,000원 </p>
    </div>
    <div class="product-card--soldout"> 
        <div class="product-card__image"> IMAGE </div>
        <h3 class="product-card__title"> 빈티지 후드티 </h3>
        <p class="product-card__price"> 29,000원 </p>
    </div>
</body>
</html>

<!-- [문제 1] 쇼핑몰 상품 카드 컴포넌트 (.product-card)
다음 조건에 맞는 쇼핑몰 상품 카드 컴포넌트의 HTML 구조와 CSS 스타일을 BEM 방법론에 맞추어 작성하세요.

Block: .product-card (상품 카드 전체를 감싸는 독립된 단위)

Element:

.product-card__image: 상품 이미지가 들어가는 부분

.product-card__title: 상품 이름 (글자 크기 18px, 굵게)

.product-card__price: 상품 가격 (색상 #e74c3c)

Modifier:

.product-card--soldout: 품절된 상품 카드의 상태. (배경색을 연한 회색 #f5f5f5로 변경하고, 투명도 opacity: 0.6을 적용)

품절 상태의 카드에는 Block 클래스와 Modifier 클래스가 함께 들어가야 합니다. -->
