<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 목록을 보여주는 태그
     1. 순서가 없는 리스트(ul)
     2. 순서가 있는 리스트(ol) -->

     <ul>
        <li> 홍길동 </li>
        <li> 임꺽정 </li>
        <li> 장길산 </li>
        <ul>
            <li> 깊이가 있는 리스트 </li>
        </ul>
     </ul>

     <ol>
        <li> 물을 끓인다. </li>
        <li> 스프를 넣는다. </li>
        <li> 면을 넣는다. </li>
     </ol>
</body>
</html>
