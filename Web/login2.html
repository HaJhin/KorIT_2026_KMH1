<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>
    <h1> 회원 등록 </h1>
    <p>
        <label for="first-name"> First Name </label> <br>
        <input id="first-name">
    </p>

    <p>
        <label for="last-name"> Last Name </label> <br>
        <input id="last-name">
    </p>

    <p>
        <label for="user-email"> Email </label> <br>
        <input type="email" id="user-email">
    </p>

    <p>
        <label for="gender1">Gender</label> <br>
        <input type="radio" name="gender" id="male"> Male
        <input type="radio" name="gender" id="gender1">Female
    </p>

    <p>
        <label for="favorite">Favorite Language</label> <br>
        <input type="checkbox" name="favorite" id="favorite"> HTML
        <input type="checkbox" name="favorite" id="favorite"> Java
        <input type="checkbox" name="favorite" id="favorite"> PHP
    </p>

    <p>
        <select name="University">
            <option value="null" selected> 대학교 선택 </option>
            <option value="seoul"> 서울대학교 </option>
            <option value="korea"> 고려대학교 </option>
            <option value="yonsei"> 연세대학교 </option>
        </select>
    </p>

    <p>
        <label for="color">Favorite Color</label> <br>
        <input type="color" id="color" name="color">
    </p>

    <p>
        <label for="date">Birth Date</label> <br>
        <input type="date" id="date">
    </p>

    <input type="button" value="Registration">
</body>

</html>
