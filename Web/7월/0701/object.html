<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 객체 (object)
        // 여러가지 속성(필드)과 메서드를 하나로 묶은 데이터 구조
        // JS에서는 객체를 만들기 위해 클래스가 꼭 필요하지는 않다.

        // 객체 생성 방법
        // 1. 객체 리터럴로 생성하기
        // 객체의 구성
        // 프로퍼티(속성) -> 키(key) : 값(value)로 구성되어 있다.
        // let 변수명 = {
        //     키 : 값,
        //     키 : 값,
        //     키 : 값
        // }; 
        let person = {
            name : "홍길동",
            age : 25,
            job : "개발자"
        };

        // 처음엔 비어있는 객체를 만들수도 있다.
        let user = {};

        // 객체 값 사용
        // 객체명.키 -> 값 사용 가능
        document.write(person.age);
        // 객체명["키"] 로도 사용 가능
        document.write(person["age"]);

        // 객체 값 변경
        let product = {
            name : "키보드",
            price : 30000,
            stock : 10
        }; 

        product.price = 35000;
        document.write("<br>");
        document.write(product.price);
        document.write("<br>");

        // 속성 추가
        person.address = "인천시";

        // 객체 속성 삭제
        delete person.user_name;
        
        // 객체 안에 함수 삽입
        person = {
            name : "김철수",
            age : 20,
            introduce : function() {
                document.write("안녕하세요 저는 김철수.");
            }
        };

        // 객체 안 함수 = 메서드
        person.introduce();

        // 생성자 함수를 통해 객체 생성
        function Student(name,age,score) {
            this.name = name;
            this.age = age;
            this.score = score;
        }

        let s1 = new Student("김철수",20,90);
        let s2 = new Student("이영희",21,80);

        // class를 이용한 객체 생성
        class Student2{
            constructor(name,age,score){
                this.name = name;
                this.age = age;
                this.score = score;
            }

            introduce(){
                document.write("저는",this.name,"입니다.");
            }
        }

        // 객체 배열
        // 객체를 요소로 가지는 배열
        let products = [
            {name:"키보드",price:30000},
            {name:"마우스",price:20000},
            {name:"모니터",price:40000},
            {name:"스피커",price:50000}
        ]

        document.write("<br>");
        document.write(products[2].name);

    </script>
</body>
</html>
