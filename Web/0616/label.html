<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <!-- label 태그
     입력 요소의 설명(이름표)을 붙여주는 태그 -->
     <label>
        HTML
        <input type="checkbox">
     </label>

     <!-- label에 for 속성을 지정해서 사용하는 방법
      for와 id가 서로 연결된다. 브라우저는  -->

     <label for="username">
        이름
     </label>
     
     <input type="text" id="username">
</body>
</html>
