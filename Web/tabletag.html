<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <!-- <table> ~ </table> 테이블을 만들어주는 태그
     <tr> : 행을 만들어주는 태그
     <td> : 열을 만들어주는 태그
     <th> : 테이블 헤더로 테이블 각 열을 대표하는 셀 -->
  
    

    <table border="1">
        <tr>
            <td> 1행 1열 </td>
        </tr>
    </table>

    <hr>

    <table border="1">
        <tr>
            <td> 1행 1열 </td>
        </tr>
        <tr>
            <td> 2행 1열 </td>
        </tr>
    </table>

    <hr>

    <table border="1">
        테이블 제목 
        <tr>
            <td> 1행 1열 </td>
            <td> 1행 2열 </td>
        </tr>
        <tr>
            <td> 2행 1열 </td>
            <td> 2행 2열 </td>
        </tr>
    </table>
    <hr>
    <table border="1">
        테이블 제목 
        <tr>
            <td colspan="3"> 메뉴판 </td>
        </tr>
        <tr>
            <td> 짜장면 </td>
            <td> 짬뽕 </td>
            <td> 탕수육 </td>
        </tr>
    </table>
    <hr>
    <table border="1">
        테이블 제목 
        <tr>
            <td rowspan="2"> 메뉴판 </td>
            <td> 짜장면 </td>
        </tr>
        <tr>
            <td> 짬뽕 </td>
        </tr>
    </table>
</body>
</html>
