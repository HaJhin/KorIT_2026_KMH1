<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .menu a {
            color: red;
        }

        .list li:first-child {
            color: red;
        }

        /* 짝수 번째 li만 선택하는 선택자 */
        .menu li:nth-child(even) {
            color: red;
        }

        input[type="text"] {
            color: red;
        }

        .board .post.notice p:first-child {
            color: red;
        }

        .box.active li:nth-child(2) {
            color: red;
        }

        .board li:nth-child(2) a {
            color: red;
        }

        .menu div a:hover {
            color: red;
        }

        /* 9. 김철수만 선택하는 선택자 */
        .member tr.vip td {color:red;}

        /* 10. 사용자 관리에만 스타일이 적용되도록 하는 선택자 */
        .dashboard .card li:nth-child(3) a {
            color: red;
        }
    </style>
</head>

<body>
    <h1> 문제 1번 </h1>
    <nav class="menu">
        <a href="#"> 홈 </a>
        <br>
        <a href="#"> 게시판 </a>
    </nav>

    <hr>
    <ul class="list">

    <hr>

    <div class="board">

        <div class="post notice">
            <p>중요 공지</p>
            <p>내용</p>
        </div>

        <div class="post">
            <p>일반 글</p>
        </div>

    </div>
    <hr>

            <li>바나나</li>

        </ul>
    </div>

        <ul>

            </li>

    <hr>
    <nav class="menu">

        <div>

        </div>
        <a href="#">문의</a>

    <hr>

        <tr>
            <td>홍길동</td>
        </tr>

    <hr>
    <div class="dashboard">

            <ul>

                <li>
                    <a href="#">대시보드</a>
                </li>

                <li class="disabled">

                </li>

                </li>

</body>

</html>
